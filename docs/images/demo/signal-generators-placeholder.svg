<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" fill="none">
  <rect width="1200" height="560" rx="28" fill="#0F172A"/>
  <rect x="36" y="36" width="1128" height="488" rx="24" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="72" y="96" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Signal generators</text>
  <text x="72" y="136" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="20">Replace with the inputs users can toggle or hold as constants.</text>

  <rect x="120" y="194" width="280" height="210" rx="24" fill="#0B1220" stroke="#1D4ED8" stroke-width="2"/>
  <rect x="460" y="194" width="280" height="210" rx="24" fill="#0B1220" stroke="#0F766E" stroke-width="2"/>
  <rect x="800" y="194" width="280" height="210" rx="24" fill="#0B1220" stroke="#C2410C" stroke-width="2"/>

  <text x="210" y="260" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">TOGGLE</text>
  <text x="505" y="260" fill="#5EEAD4" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">TRUE</text>
  <text x="844" y="260" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">FALSE</text>

  <text x="174" y="312" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="18">Interactive input source</text>
  <text x="520" y="312" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="18">Constant high signal</text>
  <text x="856" y="312" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="18">Constant low signal</text>

  <text x="318" y="484" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="18">Recommended content: one frame with TOGGLE and both constants ready for simulation.</text>

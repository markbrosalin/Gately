<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none">
  <rect width="1200" height="360" rx="28" fill="#0F172A"/>
  <text x="60" y="64" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">
    The bridge idea behind Gately
  </text>

  <rect x="60" y="110" width="240" height="160" rx="20" fill="#111827" stroke="#2563EB" stroke-width="2"/>
  <text x="88" y="164" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">
    Abstract logic
  </text>
  <text x="88" y="202" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="18">
    Boolean algebra,
  </text>
  <text x="88" y="228" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="18">
    gates, rules, theory
  </text>

  <rect x="340" y="110" width="240" height="160" rx="20" fill="#111827" stroke="#0F766E" stroke-width="2"/>
  <text x="368" y="164" fill="#5EEAD4" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">
    Visual circuit
  </text>
  <text x="368" y="202" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="18">
    The user builds and
  </text>
  <text x="368" y="228" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="18">
    edits the scheme
  </text>

  <rect x="620" y="110" width="240" height="160" rx="20" fill="#111827" stroke="#7C3AED" stroke-width="2"/>
  <text x="648" y="164" fill="#C4B5FD" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">
    Simulation result
  </text>
  <text x="648" y="202" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="18">
    The engine computes
  </text>
  <text x="648" y="228" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="18">
    and the UI shows it
  </text>

  <rect x="900" y="110" width="240" height="160" rx="20" fill="#111827" stroke="#EA580C" stroke-width="2"/>
  <text x="928" y="164" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">
    Practical context
  </text>
  <text x="928" y="202" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="18">
    Future route to
  </text>
  <text x="928" y="228" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="18">
    external devices
  </text>

  <path d="M300 190H340" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
  <path d="M580 190H620" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
  <path d="M860 190H900" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>

  <text x="60" y="316" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="18">
    Today the strongest implemented part is the visual editor + simulation flow.
  </text>

  </text>

  <rect x="450" y="264" width="300" height="180" rx="20" fill="#111827" stroke="#0F766E" stroke-width="2"/>
  <text x="478" y="318" fill="#5EEAD4" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">

  </text>

  <rect x="96" y="264" width="300" height="180" rx="20" fill="#111827" stroke="#1D4ED8" stroke-width="2"/>
  <text x="124" y="318" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">

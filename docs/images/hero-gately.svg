<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#0F172A"/>
  <rect x="32" y="32" width="1136" height="566" rx="28" fill="url(#bg)"/>
  <rect x="72" y="82" width="1056" height="466" rx="24" fill="#0B1220" stroke="#334155" stroke-width="2"/>

  <text x="96" y="166" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="700">
